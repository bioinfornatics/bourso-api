name: coverage

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: API coverage (Rust 1.96.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned compiler and matching coverage tools
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component llvm-tools-preview
          echo "$(rustup run 1.96.1 rustc --print sysroot)/bin" >> "$GITHUB_PATH"

      - name: Generate API coverage (no bank credentials)
        id: coverage
        run: bash scripts/coverage.sh

      - name: Publish report and scope limitations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-coverage
          path: |
            ${{ steps.coverage.outputs.report_dir }}/summary.txt
            ${{ steps.coverage.outputs.report_dir }}/functions.txt
            ${{ steps.coverage.outputs.report_dir }}/lcov.info
            ${{ steps.coverage.outputs.report_dir }}/html
            ${{ steps.coverage.outputs.report_dir }}/SCOPE.txt
            ${{ steps.coverage.outputs.report_dir }}/toolchain.txt
            ${{ steps.coverage.outputs.report_dir }}/tests.txt
          if-no-files-found: error

      # Keep the existing optional Codecov publication on pushes; fork PRs need no token.
      # Test, merge and report failures above remain fatal regardless of this upload.
      - name: Upload to codecov.io
        if: github.event_name == 'push'
        uses: codecov/codecov-action@84508663e988701840491b86de86b666e8a86bed # v4.3.0 (peeled commit)
        with:
          files: ${{ steps.coverage.outputs.report_dir }}/lcov.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
